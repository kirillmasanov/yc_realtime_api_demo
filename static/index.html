<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yandex Realtime API Demo</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>Yandex Realtime API</h1>
      <div class="header-actions">
        <span id="status">Подключение...</span>
        <button id="settings-btn" aria-label="Настройки">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
      </div>
    </header>

    <section id="settings-panel" hidden>
      <div class="settings-row">
        <label for="setting-voice">Голос</label>
        <select id="setting-voice">
          <option value="masha">Маша</option>
          <option value="dasha">Даша</option>
        </select>
      </div>

      <div class="settings-row">
        <label for="setting-threshold">
          Чувствительность VAD
          <span class="setting-value" id="threshold-val">0.5</span>
        </label>
        <input type="range" id="setting-threshold" min="0.1" max="0.9" step="0.1" value="0.5">
      </div>

      <div class="settings-row">
        <label for="setting-silence">
          Пауза тишины
          <span class="setting-value" id="silence-val">400</span> мс
        </label>
        <input type="range" id="setting-silence" min="200" max="2000" step="100" value="400">
      </div>

      <div class="settings-row settings-row--full">
        <label for="setting-instructions">Системный промпт</label>
        <textarea id="setting-instructions" rows="5" spellcheck="false"></textarea>
      </div>

      <div class="settings-actions">
        <button id="settings-apply">Применить</button>
      </div>
    </section>

    <main id="chat"></main>

    <footer>
      <button id="mic-btn" disabled aria-label="Push to talk">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="1" width="6" height="11" rx="3"/>
          <path d="M19 10v1a7 7 0 0 1-14 0v-1"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
          <line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
      </button>
      <span id="mic-status">Подключение...</span>
    </footer>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
